[project]
name = "sap-gateway"
version = "0.1.0"
description = "API REST genérica sobre serviços SOAP corporativos (SAP), com observabilidade OpenTelemetry"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi~=0.143.0",
    "uvicorn~=0.54.0",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.15.0",
    "zeep~=4.3.3",
    "requests~=2.34.2",
    "lxml~=6.1.3",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-requests==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
]

[project.scripts]
sap-gateway = "sap_gateway.main:run"
mock-sap = "sap_gateway.devtools.mock_sap:run"

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-timeout~=2.4",
    "httpx2~=2.13.1",
    "ruff~=0.17.0",
    "mypy~=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sap_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
timeout = 60
markers = [
    "e2e: exige a stack de observabilidade em execução (RUN_E2E=1)",
]
filterwarnings = ["error::DeprecationWarning:sap_gateway.*"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "C4", "PT", "RET", "N"]
ignore = ["S101", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S113", "S310", "E501"]
"src/sap_gateway/devtools/**" = ["S104"]
